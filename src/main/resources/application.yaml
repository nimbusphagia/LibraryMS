spring:
  application:
    name: library-ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  flyway:
    enabled: true
  data:
    web:
      pageable:
        serialization-mode: via-dto
springdoc:
  swagger-ui:
    csrf:
      enabled: true
server:
  servlet:
    session:
      timeout: 3h                   
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}   
app:
  # Open sign-up creates a new organization per owner; only for the public demo
  registration:
    open: ${REGISTRATION_OPEN:false}
  bootstrap:
    organization:
      name: ${ORGANIZATION_NAME:Main organization}
    owner:
      username: ${OWNER_USERNAME:owner}
      password: ${OWNER_PASSWORD:}
